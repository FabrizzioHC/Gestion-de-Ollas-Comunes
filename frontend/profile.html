<!DOCTYPE html>
<html lang="es">
<head>    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Red Comunitaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span class="text-primary">Red</span>Comunitaria
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="ollas.html">Ollas Comunes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="donar.html">Donar</a>
                    </li>
                    <li class="nav-item d-flex align-items-center gap-2 ms-2">
                        <button id="themeToggle" class="btn btn-outline-primary btn-sm" type="button">☀️ Modo claro</button>
                        <a id="navLogin" class="btn btn-primary btn-sm" href="login.html">Iniciar Sesión</a>
                        <a id="navProfile" class="nav-link d-none" href="profile.html">Mi Perfil</a>
                        <button id="navLogout" class="btn btn-danger btn-sm d-none ms-2">Cerrar Sesión</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h4 class="mb-4">Mi Perfil</h4>
                        <form id="profileForm">
                            <div class="mb-3">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" id="profileEmail" class="form-control" disabled>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" id="profileNombre" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Teléfono</label>
                                <input type="text" id="profileTelefono" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Rol</label>
                                <input type="text" id="profileRole" class="form-control" disabled>
                            </div>

                            <div id="adminRoleDiv" class="mb-3 d-none">
                                <label class="form-label">Cambiar Rol (admin)</label>
                                <select id="profileRoleSelect" class="form-select">
                                    <option value="donador">donador</option>
                                    <option value="olla_comun">olla_comun</option>
                                    <option value="admin">admin</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary">Guardar cambios</button>
                            <div id="profileMsg" class="mt-3"></div>
                        </form>
                        <div id="chartsContainer" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
